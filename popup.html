<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>划词翻译设置</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>极简划词翻译</h2>

    <div class="segmented-control">
      <button id="segSelection" class="seg-btn active">划词翻译</button>
      <button id="segFullpage" class="seg-btn">全页翻译</button>
    </div>

    <div id="selectionModeSettings">
    <div class="setting-item">
      <label for="targetLang">翻译为：</label>
      <select id="targetLang">
        <option value="zh-CN">简体中文 (Chinese)</option>
        <option value="en">英语 (English)</option>
        <option value="ja">日语 (Japanese)</option>
        <option value="ko">韩语 (Korean)</option>
        <option value="fr">法语 (French)</option>
        <option value="de">德语 (German)</option>
        <option value="es">西班牙语 (Spanish)</option>
        <option value="ru">俄语 (Russian)</option>
      </select>
    </div>

    <div class="setting-item">
      <label for="triggerMode">划词后行为：</label>
      <select id="triggerMode">
        <option value="icon">显示图标 (悬停翻译)</option>
        <option value="direct">直接显示翻译窗</option>
      </select>
    </div>

    <div class="setting-item">
      <div class="label-row">
        <label for="translationService">翻译服务：</label>
        <a href="#" class="manage-models">管理模型</a>
      </div>
      <select id="translationService"></select>
      <p class="model-warning" id="modelWarning" hidden></p>
    </div>

    <div class="setting-item" id="promptSection">
      <label for="systemPrompt">翻译提示词：</label>
      <textarea id="systemPrompt" rows="4" placeholder="自定义翻译提示词，使用 {{targetLang}} 表示目标语言"></textarea>
      <button id="resetPrompt" type="button">恢复默认</button>
    </div>
    </div>

    <div id="fullpageModeSettings" style="display:none">
      <div class="setting-item">
        <label for="fpTargetLang">翻译为：</label>
        <select id="fpTargetLang">
          <option value="zh-CN">简体中文 (Chinese)</option>
          <option value="en">英语 (English)</option>
          <option value="ja">日语 (Japanese)</option>
          <option value="ko">韩语 (Korean)</option>
          <option value="fr">法语 (French)</option>
          <option value="de">德语 (German)</option>
          <option value="es">西班牙语 (Spanish)</option>
          <option value="ru">俄语 (Russian)</option>
        </select>
      </div>
      <div class="setting-item">
        <div class="label-row">
          <label for="fpTranslationService">翻译服务：</label>
          <a href="#" class="manage-models">管理模型</a>
        </div>
        <select id="fpTranslationService"></select>
        <p class="model-warning" id="fpModelWarning" hidden></p>
      </div>
      <div class="setting-item" id="fpPromptSection">
        <label for="fpSystemPrompt">翻译提示词：</label>
        <textarea id="fpSystemPrompt" rows="4" placeholder="自定义翻译提示词，使用 {{targetLang}} 表示目标语言"></textarea>
        <button id="fpResetPrompt" type="button">恢复默认</button>
      </div>
      <button id="translatePageBtn" type="button" class="primary-btn">翻译当前网页</button>
      <span id="pageTranslateStatus" style="display:none; margin-top:6px; font-size:12px;"></span>
    </div>

    <div class="footer">
      <span id="saveStatus">设置自动保存</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
