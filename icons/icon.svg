<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- aitrans 工具栏图标母版：石墨色玻璃圆角方 + 单字「译」，与页内划词按钮同一套中性材质；字形取系统字体，发布用 PNG 由本文件栅格化 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58585D"/>
      <stop offset="1" stop-color="#2B2B2E"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="7" width="112" height="112" rx="27" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="8.5" y="7.5" width="111" height="111" rx="26.5" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1"/>
  <rect x="10" y="9" width="108" height="108" rx="25" fill="none" stroke="url(#rim)" stroke-width="1"/>
  <text x="64" y="84" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="66" font-weight="400" fill="#F5F5F7">译</text>
</svg>
